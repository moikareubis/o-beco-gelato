<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Cérebro Beco Gelato</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style id="toolcss"></style>
<style id="shellcss">
:root{
  color-scheme:light;
  --bg:#FCFCFB; --card:#FFFFFF; --sunken:#F4F5F0;
  --ink:#1A1C19; --muted:#565B52; --subtle:#6B7065;
  --line:#E8EAE3; --line-strong:#D6D9CE;
  --accent:#44661F; --accent-soft:#EFF3E6; --accent-ring:rgba(68,102,31,.16);
}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#shell{display:grid;grid-template-columns:240px minmax(0,1fr);align-items:start;min-height:100vh}
#nav{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;
  border-right:1px solid var(--line);background:var(--card);padding:20px 12px 24px}
#nav .marca{padding:4px 12px 18px}
#nav .marca b{display:block;font-size:16px;font-weight:600;letter-spacing:-.02em}
#nav .marca span{display:block;font-size:12.5px;color:var(--subtle);margin-top:1px}
#nav button{display:block;width:100%;text-align:left;font:inherit;border:0;background:none;color:var(--ink);
  padding:9px 12px;border-radius:10px;cursor:pointer;margin-bottom:1px}
#nav button:hover{background:var(--sunken)}
#nav button.on{background:var(--accent-soft)}
#nav button.on .t{color:var(--accent)}
#nav button .t{font-size:14.5px;font-weight:500;display:block;letter-spacing:-.01em}
#nav button .s{font-size:12.5px;color:var(--subtle);display:block;line-height:1.35;margin-top:1px}
#nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#nav .fim{margin-top:18px;padding:14px 12px 0;border-top:1px solid var(--line);font-size:12.5px;color:var(--subtle);line-height:1.5}
#host{min-width:0}
#host .wrap{max-width:980px}
@media(max-width:820px){
  #shell{grid-template-columns:minmax(0,1fr)}
  #nav{position:sticky;top:0;height:auto;border-right:0;border-bottom:1px solid var(--line);
    padding:10px 12px;display:flex;gap:6px;overflow-x:auto;z-index:40}
  #nav .marca,#nav .fim{display:none}
  #nav button{width:auto;flex:none;white-space:nowrap;margin:0;padding:7px 13px;border-radius:999px}
  #nav button .s{display:none}
}
</style>

<div id="shell">
  <nav id="nav" aria-label="Ferramentas do cérebro"></nav>
  <main id="host"></main>
</div>

<script>
(function(){
  "use strict";
  var NAV = [{"id": "painel", "n": "Painel", "d": "as seis áreas e as pendências"}, {"id": "mapa", "n": "Mapa de Bairros", "d": "onde colocar freezer, e quem está lá"}, {"id": "direto", "n": "Venda Direta", "d": "formatos, preço e os quatro freezers"}, {"id": "pipeline", "n": "Pipeline do Ponto", "d": "candidatos, score e etapas"}, {"id": "agenda", "n": "Agenda de Ativação", "d": "eventos, custo e o relógio do pote"}, {"id": "tabela", "n": "Tabela Comercial", "d": "a peça para levar na degustação"}, {"id": "balcao", "n": "Beco no Seu Balcão", "d": "o playbook e a conta por trás"}, {"id": "editorial", "n": "Linha Editorial", "d": "pilares, voz e o filtro de aprovação"}, {"id": "b2b", "n": "Camada B2B", "d": "os seis territórios e o que já pode ir ao ar"}];
  var T = {
  direto: {css: ":root{\n  color-scheme:light;\n  --bg:#FCFCFB; --card:#FFFFFF; --sunken:#F4F5F0;\n  --ink:#1A1C19; --muted:#565B52; --subtle:#6B7065;\n  --line:#E8EAE3; --line-strong:#D6D9CE;\n  --accent:#44661F; --accent-soft:#EFF3E6;\n  --warm:#8A5206; --warm-soft:#FBF1E1;\n  --crit:#A5342A; --crit-soft:#FAEAE7;\n  --on-fill:#FFFFFF;\n}\n*{box-sizing:border-box}\nbody{font-variant-numeric:tabular-nums;background:var(--bg);color:var(--ink);\n  font-family:\"Instrument Sans\",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;\n  -webkit-font-smoothing:antialiased}\n.wrap{max-width:1040px;margin:0 auto;padding-inline:18px;padding-block:0 80px}\nheader.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);\n  border-bottom:1px solid var(--line);margin-inline:-18px;padding:14px 18px;\n  display:flex;align-items:center;gap:12px;flex-wrap:wrap}\nh1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.02em}\n.save{font-size:12.5px;color:var(--subtle);margin-left:auto}\n.save[data-s=\"saving\"]{color:var(--warm)} .save[data-s=\"saved\"]{color:var(--accent)} .save[data-s=\"off\"]{color:var(--crit)}\n.sec{font-size:13.5px;font-weight:600;margin:30px 0 10px;letter-spacing:-.01em}\n.sec small{font-weight:400;color:var(--subtle);margin-left:7px;font-size:13px}\n.lead{font-size:14.5px;color:var(--muted);max-width:78ch;margin:0 0 6px}\n.regra{background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;\n  padding:13px 15px;margin-top:4px;font-size:14px;color:var(--muted);max-width:82ch;line-height:1.55}\n.regra b{color:var(--accent);font-weight:600}\n\ntable{width:100%;border-collapse:collapse;margin-top:8px;background:var(--card);\n  border:1px solid var(--line-strong);border-radius:12px;overflow:hidden}\nth{font-size:12px;color:var(--subtle);text-align:left;font-weight:500;\n  padding:10px 12px;border-bottom:1px solid var(--line-strong);background:var(--sunken)}\nth.n,td.n{text-align:right}\ntd{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}\ntr:last-child td{border-bottom:0}\ntd b{font-weight:600}\ntd small{display:block;color:var(--subtle);font-size:12px;margin-top:1px}\ntr.destaque td{background:var(--accent-soft)}\ntr.piso td{background:var(--warm-soft)}\n.pos{color:var(--accent);font-weight:600}\n.fraco{color:var(--warm);font-weight:600}\n.neg{color:var(--crit);font-weight:600}\ninput[type=number]{font-family:inherit;font-size:14px;padding:7px 9px;\n  border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--ink);\n  width:100%;max-width:110px;text-align:right}\ninput:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}\n\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px;margin-top:10px}\n.card{background:var(--card);border:1px solid var(--line-strong);border-radius:12px;padding:14px 16px}\n.card .k{font-size:12px;color:var(--subtle);font-weight:500}\n.card .v{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:2px}\n.card .d{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}\n\n.nota{font-size:13px;color:var(--muted);max-width:80ch;margin-top:10px;line-height:1.55}\n.nota b{color:var(--ink);font-weight:600}\n.aviso{background:var(--warm-soft);border:1px solid var(--warm);border-radius:12px;\n  padding:12px 14px;margin-top:12px;font-size:13.5px;color:var(--muted);max-width:82ch;line-height:1.55}\n.aviso b{color:var(--warm)}\n.prem{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-top:10px}\n.prem label{display:block;background:var(--card);border:1px solid var(--line-strong);\n  border-radius:12px;padding:11px 13px}\n.prem .k{font-size:12px;color:var(--subtle);font-weight:500;display:block;margin-bottom:5px}\n.prem input{max-width:none}\nol.passos{list-style:none;counter-reset:p;margin:10px 0 0;padding:0}\nol.passos li{counter-increment:p;position:relative;padding-left:34px;margin-bottom:11px;\n  font-size:14px;color:var(--muted);line-height:1.5}\nol.passos li::before{content:counter(p);position:absolute;left:0;top:0;width:23px;height:23px;\n  border-radius:50%;background:var(--accent);color:var(--on-fill);font-size:12.5px;font-weight:600;\n  display:flex;align-items:center;justify-content:center}\nol.passos b{color:var(--ink);font-weight:600}", html: "<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>Venda Direta<\/h1>\n    <span class=\"save\" id=\"vdsave\">—<\/span>\n  <\/header>\n\n  <div class=\"sec\">A regra do modelo<\/div>\n  <div class=\"regra\">\n    <b>O seu preço é o piso do mercado.<\/b> Quem revende — Beco Saudável, parceiro A, B ou C — não pode\n    vender abaixo do que você vende direto. <b>Acima pode<\/b>, desde que respeite o mercado e o produto.\n    Assim você nunca concorre por baixo com quem te revende, e o cliente nunca encontra o Beco Gelato\n    mais barato em outro lugar que não o seu.\n  <\/div>\n\n  <div class=\"sec\">As premissas <small>mexa aqui e a página inteira recalcula<\/small><\/div>\n  <div class=\"prem\" id=\"vdprem\"><\/div>\n  <div class=\"aviso\" id=\"vdaviso\"><\/div>\n\n  <div class=\"sec\">A escada de formatos, no seu preço <small>é esse preço que vira o piso de todo mundo<\/small><\/div>\n  <p class=\"lead\">O preço por grama cai conforme o pote cresce. É assim que o \"está caro\" desaparece sem corte de margem: quem acha o individual caro leva o de 500 g.<\/p>\n  <table id=\"vdesc\"><\/table>\n  <div class=\"nota\" id=\"vdnota\"><\/div>\n\n  <div class=\"sec\">Quais sabores aguentam o pote de 1 kg<\/div>\n  <table id=\"vdkg\"><\/table>\n\n  <div class=\"sec\">A revenda <small>o que o parceiro cobra não muda o seu resultado — só o atacado muda<\/small><\/div>\n  <table id=\"vdrev\"><\/table>\n  <div class=\"nota\" id=\"vdrevnota\"><\/div>\n\n  <div class=\"sec\">O que sobra para você em cada rota <small>pote individual<\/small><\/div>\n  <table id=\"vdrotas\"><\/table>\n\n  <div class=\"sec\">Os quatro freezers<\/div>\n  <div class=\"cards\" id=\"vdfz\"><\/div>\n  <ol class=\"passos\" id=\"vdplano\"><\/ol>\n\n  <div class=\"sec\">O caminho até a loja própria <small>quanto a venda direta precisa girar em cada degrau<\/small><\/div>\n  <table id=\"vdloja\"><\/table>\n  <div class=\"nota\" id=\"vdlojanota\"><\/div>\n<\/div>", init: function(){
(function(){
  "use strict";
  var db=null, t=null;

  var CFG={ fresh:0.0220, caro:0.0676, imp:4.5, fixo:5000, fixoLoja:13000, giro:300,
            e140:1.67, e250:2.20, e500:3.00, e1000:4.50,
            f140:22.90, f250:36.90, f500:56.90, f1000:89.90,
            c140:25.90, c250:41.90, c500:64.90, c1000:109.90,
            atacF:18.70, atacC:20.50, varF:27.90, varC:29.90 };

  var PREM=[["fresh","Gelato Fresh, R$/g",0.0001],["caro","Gelato Special e Boost, R$/g",0.0001],
            ["imp","Imposto, %",0.1],["fixo","Custo fixo mensal, R$",100],
            ["e140","Embalagem 140 g",0.01],["e250","Embalagem 250 g",0.01],
            ["e500","Embalagem 500 g",0.01],["e1000","Embalagem 1 kg",0.01],
            ["giro","Giro por freezer, potes/mês",10],["fixoLoja","Custo fixo com loja, R$",500]];

  var MF=168/719, MC=(290+261)/719;

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function rs(v){return "R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function rg(v){return "R$ "+Number(v).toLocaleString("pt-BR",{minimumFractionDigits:3,maximumFractionDigits:3});}
  function pc(v){return Math.round(v*100)+"%";}
  function setSave(s,x){var e=document.getElementById("vdsave");if(e){e.dataset.s=s;e.textContent=x;}}

  function salvar(){
    if(!db) return;
    clearTimeout(t);
    t=setTimeout(function(){
      setSave("saving","salvando…");
      db.doc("direto/cfg").set(CFG).then(function(){
        setSave("saved","salvo "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
      }).catch(function(){setSave("off","não salvou");});
    },400);
  }

  function emb(g){return {140:CFG.e140,250:CFG.e250,500:CFG.e500,1000:CFG.e1000}[g];}
  function pgm(L){return L==="F"?CFG.fresh:CFG.caro;}
  function contrib(rec,g,L){ return rec - pgm(L)*g - emb(g) - rec*(CFG.imp/100); }
  function classe(m){return m>=0.45?"pos":(m>=0.25?"fraco":"neg");}

  function corpoDe(id,cols){
    var tb=document.getElementById(id);tb.textContent="";
    var tr=el("tr");
    cols.forEach(function(c){tr.appendChild(el("th",c[1]?"n":null,c[0]));});
    var th=el("thead");th.appendChild(tr);tb.appendChild(th);
    var c=el("tbody");tb.appendChild(c);return c;
  }
  function campo(chave,step){
    var i=document.createElement("input");i.type="number";i.step=String(step);i.min="0";
    var inteiro=(chave==="giro"||chave==="fixo"||chave==="fixoLoja");
    i.value=inteiro?CFG[chave]:CFG[chave].toFixed(2);
    i.setAttribute("aria-label",chave);
    i.addEventListener("change",function(){
      var v=parseFloat(i.value);if(isNaN(v)||v<0)return;CFG[chave]=v;salvar();render();
    });
    return i;
  }

  function render(){
    var hp=document.getElementById("vdprem");hp.textContent="";
    PREM.forEach(function(p){
      var lb=el("label");lb.appendChild(el("span","k",p[1]));
      lb.appendChild(campo(p[0],p[2]));hp.appendChild(lb);
    });

    document.getElementById("vdaviso").innerHTML =
      "<b>Confira antes de usar.</b> O gelato por grama vem do CMV de 27/09 do Balanceador dividido por 130 g — "+
      "confirme em eiPote(). As embalagens de 250 g, 500 g e 1 kg são estimativa minha e precisam de cotação. "+
      "O imposto de 4,5% ainda não foi confirmado com o contador. O mix de 23% Fresh e 77% Special+Boost vem dos 8 pedidos reais de 25/09 a 18/10.";

    // ---- escada ----
    var c2=corpoDe("vdesc",[["Formato",0],["Fresh",1],["R$/g",1],["Sobra",1],
                            ["Special e Boost",1],["R$/g",1],["Sobra",1]]);
    [[140,"140 g","f140","c140"],[250,"250 g","f250","c250"],
     [500,"500 g","f500","c500"],[1000,"1 kg","f1000","c1000"]].forEach(function(r){
      var g=r[0], pf=CFG[r[2]], pcx=CFG[r[3]];
      var tr=el("tr");
      tr.appendChild(el("td",null,r[1]));
      var t1=el("td","n");t1.appendChild(campo(r[2],0.10));tr.appendChild(t1);
      tr.appendChild(el("td","n",rg(pf/g)));
      var cf=contrib(pf,g,"F");
      var t2=el("td","n");t2.appendChild(el("b",classe(cf/pf),rs(cf)+"  "+pc(cf/pf)));tr.appendChild(t2);
      var t3=el("td","n");t3.appendChild(campo(r[3],0.10));tr.appendChild(t3);
      tr.appendChild(el("td","n",rg(pcx/g)));
      var cc=contrib(pcx,g,"C");
      var t4=el("td","n");t4.appendChild(el("b",classe(cc/pcx),rs(cc)+"  "+pc(cc/pcx)));tr.appendChild(t4);
      c2.appendChild(tr);
    });
    document.getElementById("vdnota").innerHTML =
      "Fresh vai de <b>"+rg(CFG.f140/140)+"</b> no individual para <b>"+rg(CFG.f1000/1000)+"</b> no quilo — <b>"+
      pc(1-(CFG.f1000/1000)/(CFG.f140/140))+" mais barato por grama</b>. "+
      "Special e Boost, de "+rg(CFG.c140/140)+" para "+rg(CFG.c1000/1000)+". "+
      "Verde é margem saudável, laranja é apertada, vermelho não se paga.";

    // ---- 1 kg ----
    var c3=corpoDe("vdkg",[["Linha",0],["Só o gelato de 1 kg custa",1],["Preço",1],["Sobra",1],["Margem",1],["Veredito",0]]);
    [["F","Fresh","Sorbet Morango, Manga com Maracujá","f1000"],
     ["C","Special e Boost","Pistache, Torta, Alfajor, Café, Brigadeiro","c1000"]].forEach(function(r){
      var p=CFG[r[3]], ct=contrib(p,1000,r[0]), v=ct/p;
      var tr=el("tr");
      var td=el("td");td.appendChild(el("b",null,r[1]));td.appendChild(el("small",null,r[2]));tr.appendChild(td);
      tr.appendChild(el("td","n",rs(pgm(r[0])*1000)));
      tr.appendChild(el("td","n",rs(p)));
      var t1=el("td","n");t1.appendChild(el("b",classe(v),rs(ct)));tr.appendChild(t1);
      tr.appendChild(el("td","n",pc(v)));
      tr.appendChild(el("td",null, v>=0.45?"faça — é o formato que resolve o preço por grama"
        : v>=0.25?"dá, mas é o dobro do trabalho por real de margem"
        : "não faça neste preço — o gelato sozinho come quase tudo"));
      c3.appendChild(tr);
    });

    // ---- revenda ----
    var c4=corpoDe("vdrev",[["O parceiro cobra",0],["Fresh",1],["Margem dele",1],["Special e Boost",1],["Margem dele",1],["Respeita o piso?",0]]);
    var opcoes=[[CFG.f140,CFG.c140,"no piso — o seu preço"],
                [CFG.f140+3,CFG.c140+2,"pouco acima"],
                [CFG.varF,CFG.varC,"o que você sugere"],
                [30.90,32.90,"o preço de hoje"]];
    opcoes.forEach(function(o,i){
      var tr=el("tr", i===0?"piso":null);
      tr.appendChild(el("td",null,o[2]));
      var tf=el("td","n");
      if(i===2){tf.appendChild(campo("varF",0.10));}else{tf.appendChild(document.createTextNode(rs(o[0])));}
      tr.appendChild(tf);
      var mf=(o[0]-CFG.atacF)/o[0];
      var t1=el("td","n");t1.appendChild(el("b",mf>=0.28?"pos":(mf>=0.2?"fraco":"neg"),pc(mf)));tr.appendChild(t1);
      var tc=el("td","n");
      if(i===2){tc.appendChild(campo("varC",0.10));}else{tc.appendChild(document.createTextNode(rs(o[1])));}
      tr.appendChild(tc);
      var mc=(o[1]-CFG.atacC)/o[1];
      var t2=el("td","n");t2.appendChild(el("b",mc>=0.28?"pos":(mc>=0.2?"fraco":"neg"),pc(mc)));tr.appendChild(t2);
      var ok=(o[0]>=CFG.f140-0.001 && o[1]>=CFG.c140-0.001);
      tr.appendChild(el("td",null, ok?"sim":"não — abaixo do seu preço, não pode"));
      c4.appendChild(tr);
    });
    var hojeM=MF*contrib(CFG.atacF,140,"F")+MC*contrib(CFG.atacC,140,"C");
    document.getElementById("vdrevnota").innerHTML =
      "Com o atacado em "+rs(CFG.atacF)+" e "+rs(CFG.atacC)+", <b>o preço que o parceiro cobra não muda nada para você</b>: "+
      "sobram "+rs(hojeM)+" por pote em qualquer linha dessa tabela. O que o piso faz é impedir que ele venda abaixo de você. "+
      "Repare que <b>no piso a margem dele fica apertada</b> — "+pc((CFG.c140-CFG.atacC)/CFG.c140)+" no Special e Boost. "+
      "A maioria vai querer vender perto de "+rs(CFG.varC)+", onde a margem chega a "+pc((CFG.varC-CFG.atacC)/CFG.varC)+", "+
      "que é o normal de mercado. Isso é permitido pela sua regra e não te custa nada.";

    // ---- rotas ----
    var c5=corpoDe("vdrotas",[["Rota",0],["Entra no seu caixa",1],["Fresh",1],["Special e Boost",1],["Média do mix",1],["Equilíbrio",1]]);
    var md=MF*contrib(CFG.f140,140,"F")+MC*contrib(CFG.c140,140,"C");
    [["Venda direta — você vende no seu preço",CFG.f140,CFG.c140,true],
     ["Revenda — atacado de hoje",CFG.atacF,CFG.atacC,false]
    ].forEach(function(r){
      var tr=el("tr",r[3]?"destaque":null);
      tr.appendChild(el("td",null,r[0]));
      var te=el("td","n");
      if(!r[3]){
        te.appendChild(campo("atacF",0.10));
        te.appendChild(document.createTextNode(" / "));
        te.appendChild(campo("atacC",0.10));
      } else { te.appendChild(document.createTextNode(rs(r[1])+" / "+rs(r[2]))); }
      tr.appendChild(te);
      var f=contrib(r[1],140,"F"), ca=contrib(r[2],140,"C"), m=MF*f+MC*ca;
      var t1=el("td","n");t1.appendChild(el("b",f>0?"pos":"neg",rs(f)));tr.appendChild(t1);
      var t2=el("td","n");t2.appendChild(el("b",ca>=8?"pos":(ca>0?"fraco":"neg"),rs(ca)));tr.appendChild(t2);
      var t3=el("td","n");t3.appendChild(el("b",null,rs(m)));tr.appendChild(t3);
      tr.appendChild(el("td","n",m>0?Math.ceil(CFG.fixo/m)+" un/mês":"—"));
      c5.appendChild(tr);
    });

    // ---- freezers ----
    var potes=4*CFG.giro, contr=potes*hojeM;
    var hf=document.getElementById("vdfz");hf.textContent="";
    [["4 freezers, giro de "+CFG.giro,potes.toLocaleString("pt-BR")+" potes/mês","vendidos por quem hospeda, acima do seu piso"],
     ["Contribuição",rs(contr),"com o atacado em "+rs(CFG.atacF)+" e "+rs(CFG.atacC)],
     ["Sobra no mês",rs(contr-CFG.fixo),(contr-CFG.fixo)>0?"depois do custo fixo":"ainda não paga o fixo"],

  pipeline: {css: ":root{\n  color-scheme:light;\n  --ground:#FCFCFB; --surface:#FFFFFF; --surface-2:#F4F5F0;\n  --ink:#1A1C19; --muted:#565B52; --faint:#6B7065;\n  --line:#E8EAE3; --line-strong:#D6D9CE;\n  --accent:#44661F; --accent-soft:#EFF3E6;\n  --warm:#8A5206; --warm-soft:#FBF1E1;\n  --good:#44661F; --good-soft:#EFF3E6;\n  --crit:#A5342A; --crit-soft:#FAEAE7;\n  --on-fill:#FFFFFF;\n  --shadow:none;\n}\n*{box-sizing:border-box}\nbody{font-variant-numeric:tabular-nums;margin:0;background:var(--ground);color:var(--ink);font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:15.5px;line-height:1.55}\n.wrap{max-width:1080px;margin:0 auto;padding-inline:18px;padding-block:0 80px}\n.mono,.eyebrow,th,label,select,input,button,.k,.chip,.sc,.et{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif}\nh1,h2,h3{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1;text-wrap:balance}\n\nheader.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);border-bottom:1px solid var(--line);margin-inline:-18px;padding:12px 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}\nh1{font-size:18px}\n.savestate{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:11px;color:var(--faint);margin-left:auto}\n.savestate[data-s=\"saving\"]{color:var(--warm)}\n.savestate[data-s=\"saved\"]{color:var(--good)}\n.savestate[data-s=\"off\"]{color:var(--crit)}\n\nh2{font-size:11px;font-weight:600;letter-spacing:normal;color:var(--faint);font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;margin:32px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}\np.note{font-size:13.5px;color:var(--muted);max-width:74ch;margin:10px 0 0}\n\n/* vagas */\n.vagas{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}\n@media(max-width:840px){.vagas{grid-template-columns:1fr 1fr}}\n@media(max-width:460px){.vagas{grid-template-columns:1fr}}\n.vaga{background:var(--surface);padding:13px 14px;min-height:104px}\n.vaga.cheia{background:var(--good-soft)}\n.vaga .n{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:9.5px;letter-spacing:normal;color:var(--accent);font-weight:500}\n.vaga .canal{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-weight:600;font-size:14.5px;margin-top:5px}\n.vaga .meta{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:10.5px;color:var(--faint);margin-top:3px}\n.vaga .quem{margin-top:8px;font-size:13.5px;font-weight:600;color:var(--good);line-height:1.35}\n.vaga .livre{margin-top:8px;font-size:12.5px;color:var(--faint);font-style:italic}\n\n/* funil */\n.funil{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}\n@media(max-width:820px){.funil{grid-template-columns:repeat(3,1fr)}}\n.fase{background:var(--surface);padding:10px 8px;text-align:center}\n.fase .e{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:9.5px;color:var(--accent);letter-spacing:normal;font-weight:500}\n.fase .q{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-weight:800;font-size:22px;line-height:1;margin-top:5px;font-variant-numeric:tabular-nums}\n.fase .q.zero{color:var(--faint);font-weight:600}\n.fase .nm{font-size:10.5px;color:var(--faint);margin-top:4px;line-height:1.3;font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif}\n\n/* candidatos */\n.cand{background:var(--surface);border:1px solid var(--line);border-radius:5px;margin-bottom:8px;overflow:hidden}\n.cand-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;background:none;border:0;width:100%;text-align:left;font:inherit;color:inherit}\n.cand-head:hover{background:var(--surface-2)}\n.cand-head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}\n.sc{flex:none;width:32px;height:32px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}\n.sc.go{background:var(--good-soft);color:var(--good)}\n.sc.fila{background:var(--warm-soft);color:var(--warm)}\n.sc.no{background:var(--crit-soft);color:var(--crit)}\n.cand .nm{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-weight:600;font-size:15px}\n.cand .sub{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:10.5px;color:var(--faint);margin-top:1px}\n.cand .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}\n.chip{font-size:10px;letter-spacing:normal;padding:3px 7px;border-radius:2px;border:1px solid var(--line-strong);color:var(--muted);white-space:nowrap}\n.chip.go{background:var(--good-soft);border-color:var(--good);color:var(--good)}\n.chip.fila{background:var(--warm-soft);border-color:var(--warm);color:var(--warm)}\n.chip.no{background:var(--crit-soft);border-color:var(--crit);color:var(--crit)}\n.chip.et{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}\n.chip.vaga{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}\n.cand-body{padding:14px;border-top:1px solid var(--line);background:var(--surface-2)}\n\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}\n.f label{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--faint);margin-bottom:5px}\n.f input,.f select,.f textarea{width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink);font-size:13px;font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif}\n.f textarea{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:14px;min-height:54px;resize:vertical}\n.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}\n.dados{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:11.5px;color:var(--muted);line-height:1.7}\n.dados b{color:var(--ink);font-weight:500}\n.acoes{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}\nbutton.b{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:11px;letter-spacing:normal;padding:6px 12px;border-radius:3px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);cursor:pointer}\nbutton.b:hover{border-color:var(--accent);color:var(--accent)}\nbutton.b.pri{background:var(--accent);border-color:var(--accent);color:var(--on-fill)}\nbutton.b.del:hover{border-color:var(--crit);color:var(--crit)}\n\n.vazio{background:var(--surface);border:1px dashed var(--line-strong);border-radius:5px;padding:26px 20px;text-align:center;color:var(--muted);font-size:14.5px}\n\n/* novo */\n.novo{background:var(--surface);border:1px solid var(--line-strong);border-radius:5px;overflow:hidden}\n.novo-h{padding:12px 15px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:10px;letter-spacing:normal;color:var(--muted);display:flex;gap:10px;align-items:center}\n.novo-h .prev{margin-left:auto;font-size:11px;letter-spacing:normal;text-transform:none;color:var(--accent);font-weight:500}\n.novo-b{padding:15px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}", html: "<div class=\"wrap\">\n  <header class=\"top\">\n    <h1>Pipeline do Ponto Parceiro<\/h1>\n    <span class=\"savestate\" id=\"savestate\">—<\/span>\n  <\/header>\n\n  <h2>As cinco vagas<\/h2>\n  <div class=\"vagas\" id=\"vagas\"><\/div>\n\n  <h2>O funil<\/h2>\n  <div class=\"funil\" id=\"funil\"><\/div>\n\n  <h2>Candidatos<\/h2>\n  <div id=\"lista\"><\/div>\n\n  <h2>Novo candidato<\/h2>\n  <div class=\"novo\">\n    <div class=\"novo-h\">\n      <span>Os onze campos do formulário · score calculado na hora<\/span>\n      <span class=\"prev\" id=\"prev\">—<\/span>\n    <\/div>\n    <div class=\"novo-b f\">\n      <div class=\"grid\">\n        <div><label for=\"n-est\">Estabelecimento<\/label><input type=\"text\" id=\"n-est\" placeholder=\"como aparece na fachada\"><\/div>\n        <div><label for=\"n-tipo\">Tipo<\/label><select id=\"n-tipo\"><\/select><\/div>\n        <div><label for=\"n-bairro\">Bairro e cidade<\/label><input type=\"text\" id=\"n-bairro\"><\/div>\n        <div><label for=\"n-resp\">Responsável<\/label><input type=\"text\" id=\"n-resp\"><\/div>\n        <div><label for=\"n-zap\">WhatsApp<\/label><input type=\"text\" id=\"n-zap\" inputmode=\"tel\"><\/div>\n        <div><label for=\"n-cargo\">Cargo<\/label><select id=\"n-cargo\"><\/select><\/div>\n        <div><label for=\"n-fluxo\">Pessoas por dia<\/label><select id=\"n-fluxo\"><\/select><\/div>\n        <div><label for=\"n-valor\" id=\"n-valor-l\">Ticket médio da casa<\/label><select id=\"n-valor\"><\/select><\/div>\n        <div><label for=\"n-sob\">Já vende sobremesa<\/label><select id=\"n-sob\"><\/select><\/div>\n        <div><label for=\"n-esp\">Tomada perto do caixa<\/label><select id=\"n-esp\"><\/select><\/div>\n        <div><label for=\"n-insta\">Instagram<\/label><input type=\"text\" id=\"n-insta\" placeholder=\"opcional\"><\/div>\n      <\/div>\n      <div style=\"margin-top:10px\"><label for=\"n-motivo\">Por que quer ser um ponto Beco<\/label><textarea id=\"n-motivo\" placeholder=\"opcional — serve de desempate entre dois scores iguais\"><\/textarea><\/div>\n      <div class=\"acoes\"><button class=\"b pri\" id=\"n-add\" type=\"button\">Adicionar candidato<\/button><button class=\"b\" id=\"n-clear\" type=\"button\">Limpar<\/button><\/div>\n    <\/div>\n  <\/div>\n\n  <p class=\"note\">O score, o veredito e o nível de freezer saem da régua da Jornada do Ponto Parceiro: fluxo, ticket ou mensalidade, cargo de quem decide, se já vende sobremesa e o tipo do ponto. Fluxo abaixo de 40 pessoas/dia, ticket abaixo de R$ 25, mensalidade abaixo de R$ 100 ou falta de tomada eliminam na hora. O que você marcar aqui eu leio na próxima vez.<\/p>\n<\/div>", init: function(){
(function(){
  "use strict";

  var TIPOS = [
    {v:"acad", t:"Academia / box / studio", p:2, acad:true},
    {v:"cafe", t:"Cafeteria", p:2},
    {v:"rest", t:"Restaurante", p:2},
    {v:"pad",  t:"Padaria", p:1},
    {v:"merc", t:"Mercado / empório", p:1},
    {v:"out",  t:"Outro", p:1}
  ];
  var CARGO = [{v:"dono",t:"Sou o dono",p:2},{v:"ger",t:"Sou gerente",p:1},{v:"out",t:"Outro",p:0}];
  var FLUXO = [
    {v:"250",t:"Mais de 250",p:3,nivel:"Beco V"},
    {v:"80", t:"De 80 a 250",p:2,nivel:"Beco M"},
    {v:"40", t:"De 40 a 79",p:1,nivel:"Beco P"},
    {v:"0",  t:"Menos de 40",p:0,elim:true,nivel:"—"}
  ];
  var TICKET = [
    {v:"60",t:"R$ 60 ou mais",p:3},{v:"40",t:"R$ 40 a R$ 59",p:2},
    {v:"25",t:"R$ 25 a R$ 39",p:1},{v:"0",t:"Menos de R$ 25",p:0,elim:true}
  ];
  var MENSAL = [
    {v:"250",t:"R$ 250 ou mais",p:3},{v:"150",t:"R$ 150 a R$ 249",p:2},
    {v:"100",t:"R$ 100 a R$ 149",p:1},{v:"0",t:"Menos de R$ 100",p:0,elim:true}
  ];
  var SOB = [{v:"20",t:"Sim, acima de R$ 20",p:2},{v:"men",t:"Sim, mais barata",p:1},{v:"nao",t:"Não vende",p:0}];
  var ESP = [{v:"sim",t:"Sim",p:0},{v:"nao",t:"Não",p:0,elim:true}];

  var ETAPAS = [
    {v:"E1",t:"Entrada"},{v:"E2",t:"Candidatura"},{v:"E3",t:"Seleção"},
    {v:"E4",t:"Degustação"},{v:"E5",t:"Proposta"},{v:"E6",t:"Negociação"},
    {v:"E7",t:"Contrato"},{v:"E8",t:"Instalação"},{v:"E9",t:"Medição"}
  ];

  var VAGAS = [
    {n:1, canal:"Academia / box", nivel:"Beco V", min:240},
    {n:2, canal:"Academia / box", nivel:"Beco M", min:120},
    {n:3, canal:"Cafeteria",      nivel:"Beco M", min:120},
    {n:4, canal:"Restaurante",    nivel:"Beco P", min:60},
    {n:5, canal:"Livre",          nivel:"Beco P", min:60}
  ];

  var itens = [], db = null, aberto = {}, timers = {};

  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
  function byV(arr,v){for(var i=0;i<arr.length;i++)if(arr[i].v===v)return arr[i];return null;}
  function opts(sel,arr){sel.textContent="";arr.forEach(function(o){var e=el("option",null,o.t);e.value=o.v;sel.appendChild(e);});}
  function setSave(s,t){var e=document.getElementById("savestate");e.dataset.s=s;e.textContent=t;}
  function uid(){return "c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function ehAcad(tipo){var t=byV(TIPOS,tipo);return !!(t&&t.acad);}

  function avaliar(c){
    var t=byV(TIPOS,c.tipo)||TIPOS[5];
    var f=byV(FLUXO,c.fluxo)||FLUXO[3];
    var escala = ehAcad(c.tipo)?MENSAL:TICKET;
    var v=byV(escala,c.valor)||escala[3];
    var g=byV(CARGO,c.cargo)||CARGO[2];
    var s=byV(SOB,c.sobremesa)||SOB[2];
    var e=byV(ESP,c.espaco)||ESP[0];
    var elim = !!(f.elim||v.elim||e.elim);
    var score = f.p+v.p+g.p+s.p+t.p;
    var veredito = elim ? "Não agora" : (score>=9?"Degustar":(score>=6?"Fila":"Não agora"));
    return {score:score, elim:elim, veredito:veredito, nivel: elim?"—":f.nivel};
  }
  function classe(v){return v==="Degustar"?"go":(v==="Fila"?"fila":"no");}

  function salvar(c){
    if(!db) return;
    clearTimeout(timers[c.id]);
    timers[c.id]=setTimeout(function(){
      setSave("saving","salvando…");
      var copia={}; for(var k in c) if(k!=="id") copia[k]=c[k];
      copia.atualizado=new Date().toISOString();
      db.doc("candidatos/"+c.id).set(copia).then(function(){
        setSave("saved","salvo "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
      }).catch(function(){setSave("off","não salvou");});
    },500);
  }
  function remover(c){
    itens=itens.filter(function(x){return x!==c;});
    render();
    if(db) db.doc("candidatos/"+c.id).delete().catch(function(){setSave("off","não salvou");});
  }

  function renderVagas(){
    var host=document.getElementById("vagas"); host.textContent="";
    VAGAS.forEach(function(v){
      var ocupante=null;
      for(var i=0;i<itens.length;i++) if(String(itens[i].vaga)===String(v.n)) ocupante=itens[i];
      var d=el("div","vaga"+(ocupante?" cheia":""));
      d.appendChild(el("div","n","Vaga "+v.n));
      d.appendChild(el("div","canal",v.canal));
      d.appendChild(el("div","meta",v.nivel+" · mín. "+v.min+" potes"));
      if(ocupante) d.appendChild(el("div","quem",ocupante.estabelecimento||"(sem nome)"));
      else d.appendChild(el("div","livre","vaga aberta"));
      host.appendChild(d);
    });
  }

  function renderFunil(){
    var host=document.getElementById("funil"); host.textContent="";
    ETAPAS.forEach(function(e){
      var q=itens.filter(function(c){return c.etapa===e.v;}).length;
      var d=el("div","fase");
      d.appendChild(el("div","e",e.v));
      d.appendChild(el("div","q"+(q?"":" zero"),String(q)));
      d.appendChild(el("div","nm",e.t));
      host.appendChild(d);
    });
  }

  function campo(lbl,node){
    var d=el("div"); var l=el("label",null,lbl);
    l.setAttribute("for",node.id); d.appendChild(l); d.appendChild(node); return d;
  }

  function renderLista(){
    var host=document.getElementById("lista"); host.textContent="";
    if(!itens.length){
      host.appendChild(el("div","vazio","Nenhum candidato ainda. As cinco vagas estão abertas — comece pelas mensagens que já chegaram."));
      return;
    }
    var ordem={"Degustar":0,"Fila":1,"Não agora":2};
    itens.slice().sort(function(a,b){
      var av=avaliar(a), bv=avaliar(b);
      if(a.vaga&&!b.vaga) return -1;
      if(b.vaga&&!a.vaga) return 1;
      if(ordem[av.veredito]!==ordem[bv.veredito]) return ordem[av.veredito]-ordem[bv.veredito];
      return bv.score-av.score;
    }).forEach(function(c){
      var a=avaliar(c);
      var card=el("div","cand");
      var head=el("button","cand-head"); head.type="button";
      var sc=el("div","sc "+classe(a.veredito),String(a.score)); head.appendChild(sc);
      var nb=el("div");
      nb.appendChild(el("div","nm",c.estabelecimento||"(sem nome)"));
      var t=byV(TIPOS,c.tipo);
      nb.appendChild(el("div","sub",(t?t.t:"—")+(c.bairro?" · "+c.bairro:"")+(c.responsavel?" · "+c.responsavel:"")));
      head.appendChild(nb);
      var r=el("div","right");
      if(c.vaga) r.appendChild(el("span","chip vaga","Vaga "+c.vaga));
      r.appendChild(el("span","chip "+classe(a.veredito),a.veredito));
      if(a.nivel!=="—") r.appendChild(el("span","chip",a.nivel));
      if(c.etapa) r.appendChild(el("span","chip et",c.etapa));
      head.appendChild(r);
      card.appendChild(head);

      var body=el("div","cand-body"); body.hidden=!aberto[c.id];
      var g=el("div","grid f");

      var se=el("select"); se.id="et-"+c.id; opts(se,ETAPAS); se.value=c.etapa||"E1";
      se.addEventListener("change",function(){c.etapa=se.value;salvar(c);renderFunil();renderLista();});
      g.appendChild(campo("Etapa",se));

      var sv=el("select"); sv.id="vg-"+c.id;
      opts(sv,[{v:"",t:"—"}].concat(VAGAS.map(function(v){return {v:String(v.n),t:"Vaga "+v.n+" · "+v.canal};})));
      sv.value=c.vaga?String(c.vaga):"";
      sv.addEventListener("change",function(){c.vaga=sv.value;salvar(c);render();});
      g.appendChild(campo("Vaga do piloto",sv));

      var it=el("input"); it.type="date"; it.id="ut-"+c.id; it.value=c.ultimoToque||"";
      it.addEventListener("change",function(){c.ultimoToque=it.value;salvar(c);});
      g.appendChild(campo("Último toque",it));

      var ia=el("input"); ia.type="text"; ia.id="pa-"+c.id; ia.value=c.proximaAcao||""; ia.placeholder="nunca deixe vazio";
      ia.addEventListener("input",function(){c.proximaAcao=ia.value;salvar(c);});
      g.appendChild(campo("Próxima ação",ia));

      var ipd=el("input"); ipd.type="date"; ipd.id="pd-"+c.id; ipd.value=c.proximaData||"";
      ipd.addEventListener("change",function(){c.proximaData=ipd.value;salvar(c);});
      g.appendChild(campo("Data da próxima ação",ipd));

      var iz=el("input"); iz.type="text"; iz.id="zp-"+c.id; iz.value=c.whatsapp||"";
      iz.addEventListener("input",function(){c.whatsapp=iz.value;salvar(c);});
      g.appendChild(campo("WhatsApp",iz));

      body.appendChild(g);

      var ob=el("div","f"); ob.style.marginTop="10px";
      var ta=el("textarea"); ta.id="ob-"+c.id; ta.value=c.obs||"";
      ta.placeholder="o que ele falou na degustação, quem decide de verdade, o que ele já vende";
      ta.addEventListener("input",function(){c.obs=ta.value;salvar(c);});
      ob.appendChild(campo("Observações",ta));
      body.appendChild(ob);

      var esc = ehAcad(c.tipo)?MENSAL:TICKET;
      var dd=el("div","dados");
      var fl=byV(FLUXO,c.fluxo), vl=byV(esc,c.valor), cg=byV(CARGO,c.cargo), sb=byV(SOB,c.sobremesa), ep=byV(ESP,c.espaco);
      dd.innerHTML =
        "Score <b>"+a.score+"/12</b> · fluxo "+(fl?fl.t+" ("+fl.p+")":"—")+
        " · "+(ehAcad(c.tipo)?"mensalidade ":"ticket ")+(vl?vl.t+" ("+vl.p+")":"—")+
        " · cargo "+(cg?cg.t+" ("+cg.p+")":"—")+
        " · sobremesa "+(sb?sb.t+" ("+sb.p+")":"—")+
        " · tipo ("+(byV(TIPOS,c.tipo)?byV(TIPOS,c.tipo).p:0)+")"+
        " · tomada "+(ep?ep.t:"—")+
        (a.elim?" · <b>ELIMINATÓRIO</b>":"")+
        (c.instagram?" · "+c.instagram:"");
      if(c.motivo){ var m=el("div"); m.style.marginTop="6px"; m.style.fontFamily='"Instrument Sans", system-ui, -apple-system, sans-serif'; m.style.fontSize="13.5px"; m.textContent="“"+c.motivo+"”"; dd.appendChild(m); }
      body.appendChild(dd);

      var ac=el("div","acoes");
      var bx=el("button","b del","Remover"); bx.type="button";
      bx.addEventListener("click",function(){remover(c);});
      ac.appendChild(bx);
      body.appendChild(ac);

      card.appendChild(body);

a, não público de massa procurando preço. Evento grande com público errado custa mais e ensina menos que evento pequeno com público certo.<\/li>\n  <li><b>Sai dali um ponto parceiro.<\/b> O organizador, um patrocinador ou outra marca presente é porta de entrada. Evento aqui é investimento de marca, não caixa: o retorno é presença, conteúdo e contato — mas contato que vira balcão vale mais que contato que vira só foto.<\/li>\n  <li><b>Cabe na cozinha.<\/b> Cada ciclo é 1,5 kg e o lote são 3 ciclos. Você está saindo da cozinha em outubro: um evento de 300 pessoas em copinho de 60 g são 20 kg com perda, ou 13 ciclos. Isso é uma semana de produção que não vai para o freezer.<\/li>\n  <li><b>Tem que dar para operar daqui.<\/b> Ir, montar, servir e voltar no mesmo dia, com o gelato saindo da sua cozinha. Evento que exige produzir no local ou dormir fora não custa só o evento: custa o dia seguinte, e você está sozinho na operação. Foi isso que tirou o Morro de São Paulo, que era a melhor etapa em público de todas.<\/li>\n  <li><b>Rende conteúdo.<\/b> A criação é terceirizada e precisa de material. Evento sem foto aproveitável perde o único retorno que não depende de venda.<\/li>\n  <li><b>E a regra que não se negocia:<\/b> evento se serve no copinho de ativação de 60 g, nunca no pote de 150 ml. O pote de venda é o estoque que segura o lançamento — se alguém pedir pote inteiro, ou compra, ou vira degustação.<\/li>\n<\/ol>\n\n<div class=\"sec\">Premissas<\/div>\n<div class=\"prem\" id=\"prem\"><\/div>\n<\/div>", init: function(){

  function inp(rot,tipo,obj,chave,depois){

    i.value=obj[chave]!=null?obj[chave]:"";
    i.addEventListener("input",function(){
      obj[chave]=tipo==="number"?(i.value===""?"":Math.max(0,+i.value||0)):i.value;
      salvarEvento(obj); if(depois) depois();
    });
    d.appendChild(i); return d;
  }

2>Tabela de preços<\/h2>\n  <p class=\"sub\">Três linhas, seis sabores. O preço é por linha — o que muda é o produto, não o volume que você compra.<\/p>\n\n  <div class=\"tw\">\n    <table>\n      <thead>\n        <tr>\n          <th>Linha<\/th><th>Sabores<\/th>\n          <th class=\"n\">Atacado<\/th><th class=\"n\">Sugerido<\/th>\n          <th class=\"n\">Você ganha<\/th><th class=\"n\">Margem<\/th>\n        <\/tr>\n      <\/thead>\n      <tbody>\n        <tr>\n          <td class=\"linha\">Fresh<\/td>\n          <td class=\"sab\">Sorbet Morango<br>Manga com Maracujá\n            <div class=\"selos\"><span class=\"selo o\">Vegano<\/span><span class=\"selo o\">Sem lactose<\/span><span class=\"selo v\">Alto teor de fibras<\/span><\/div>\n          <\/td>\n          <td class=\"n\">R$ 18,70<\/td><td class=\"n\">R$ 29,90<\/td>\n          <td class=\"n ganho\">R$ 11,20<\/td><td class=\"n\">37,5%<\/td>\n        <\/tr>\n        <tr>\n          <td class=\"linha\">Special<\/td>\n          <td class=\"sab\">Torta de Limão<br>Pistache\n            <div class=\"selos\"><span class=\"selo o\">Sem lactose<\/span><span class=\"selo v\">Sem adição de açúcares<\/span><span class=\"selo v\">Alto teor de fibras<\/span><\/div>\n          <\/td>\n          <td class=\"n\">R$ 20,50<\/td><td class=\"n\">R$ 32,90<\/td>\n          <td class=\"n ganho\">R$ 12,40<\/td><td class=\"n\">37,7%<\/td>\n        <\/tr>\n        <tr>\n          <td class=\"linha\">Boost<\/td>\n          <td class=\"sab\">Café Proteico<br>Brigadeiro Proteico\n            <div class=\"selos\"><span class=\"selo v\">Fonte de proteína<\/span><span class=\"selo v\">Sem adição de açúcares<\/span><span class=\"selo v\">Alto teor de fibras<\/span><\/div>\n          <\/td>\n          <td class=\"n\">R$ 20,50<\/td><td class=\"n\">R$ 32,90<\/td>\n          <td class=\"n ganho\">R$ 12,40<\/td><td class=\"n\">37,7%<\/td>\n        <\/tr>\n      <\/tbody>\n      <caption>Pote individual de 150 ml. \"Você ganha\" é a diferença entre o que você paga e o preço de balcão sugerido. O preço sugerido é sugestão — quem define o seu balcão é você.<\/caption>\n    <\/table>\n  <\/div>\n\n  <h2>O freezer<\/h2>\n  <p class=\"sub\">Escolhido pelo tamanho do seu ponto e instalado adesivado, pronto para vender. Ele é e continua sendo da Beco: manutenção, compressor e troca por um maior são por nossa conta.<\/p>\n\n  <div class=\"fz\">\n    <div class=\"fzc\">\n      <div class=\"nome\">Beco P<\/div>\n      <div class=\"cap\">até 200 potes<\/div>\n      <dl>\n        <div class=\"row\"><dt>Pedido mínimo<\/dt><dd>60 potes/mês<\/dd><\/div>\n        <div class=\"row\"><dt>Você ganha<\/dt><dd class=\"hl\">R$ 720/mês<\/dd><\/div>\n        <div class=\"row\"><dt>Você investe<\/dt><dd>R$ 0<\/dd><\/div>\n      <\/dl>\n    <\/div>\n    <div class=\"fzc\">\n      <div class=\"nome\">Beco M<\/div>\n      <div class=\"cap\">até 300 potes<\/div>\n      <dl>\n        <div class=\"row\"><dt>Pedido mínimo<\/dt><dd>120 potes/mês<\/dd><\/div>\n        <div class=\"row\"><dt>Você ganha<\/dt><dd class=\"hl\">R$ 1.440/mês<\/dd><\/div>\n        <div class=\"row\"><dt>Você investe<\/dt><dd>R$ 0<\/dd><\/div>\n      <\/dl>\n    <\/div>\n    <div class=\"fzc\">\n      <div class=\"nome\">Beco V<\/div>\n      <div class=\"cap\">vertical, à altura dos olhos<\/div>\n      <dl>\n        <div class=\"row\"><dt>Pedido mínimo<\/dt><dd>240 potes/mês<\/dd><\/div>\n        <div class=\"row\"><dt>Você ganha<\/dt><dd class=\"hl\">R$ 2.880/mês<\/dd><\/div>\n        <div class=\"row\"><dt>Você investe<\/dt><dd>R$ 0<\/dd><\/div>\n      <\/dl>\n    <\/div>\n  <\/div>\n\n  <div class=\"destaque\">\n    <div class=\"t\">Girou mais, freezer maior — por nossa conta<\/div>\n    <p>Quando o seu ponto bate o giro do tamanho seguinte por dois meses, a gente troca o equipamento sem você pedir e sem custo. Quem compra o próprio freezer fica preso ao tamanho que comprou.<\/p>\n  <\/div>\n\n  <h2>Condições<\/h2>\n  <div class=\"cond\">\n    <div class=\"r\"><dt>Primeiro pedido<\/dt><dd>30 dias para pagar. Você vende antes de desembolsar.<\/dd><\/div>\n    <div class=\"r\"><dt>2º e 3º pedidos<\/dt><dd>21 dias.<\/dd><\/div>\n    <div class=\"r\"><dt>Do 4º em diante<\/dt><dd>14 dias, ou Pix na entrega com 4% de desconto.<\/dd><\/div>\n    <div class=\"r\"><dt>Pedido mínimo<\/dt><dd>Apurado por trimestre, não por mês — um mês fraco não gera problema nenhum.<\/dd><\/div>\n    <div class=\"r\"><dt>Sabor parado<\/dt><dd>Troca de até 5% do volume por trimestre, produto íntegro e na validade.<\/dd><\/div>\n    <div class=\"r\"><dt>Exclusividade<\/dt><dd>Apenas dentro do freezer Beco. O que você já vende continua onde está.<\/dd><\/div>\n    <div class=\"r\"><dt>Energia<\/dt><dd>Cerca de R$ 78 por mês no modelo de 503 litros, por sua conta.<\/dd><\/div>\n    <div class=\"r\"><dt>Saída<\/dt><dd>Sem multa, em qualquer momento. Devolve o freezer e encerra.<\/dd><\/div>\n  <\/div>\n\n  <footer>\n    <div class=\"fm\">O Beco Gelato<\/div>\n    <p>Tabela válida para o programa Ponto Parceiro. Preços de atacado por pote de 150 ml, com entrega inclusa em rota urbana. O preço de balcão é sugerido e não vinculante.<\/p>\n  <\/footer>\n\n<\/div>", init: function(){

  balcao: {css: ":root{\n  color-scheme:light;\n  --ground:#FCFCFB; --surface:#FFFFFF; --surface-2:#F4F5F0;\n  --ink:#1A1C19; --muted:#565B52; --faint:#6B7065;\n  --line:#E8EAE3; --line-strong:#D6D9CE;\n  --accent:#44661F; --accent-soft:#EFF3E6;\n  --warm:#8A5206; --warm-soft:#FBF1E1;\n  --good:#44661F; --good-soft:#EFF3E6;\n  --crit:#A5342A; --crit-soft:#FAEAE7;\n  --on-fill:#FFFFFF;\n  --shadow:none;\n}\n*{box-sizing:border-box}\nbody{font-variant-numeric:tabular-nums;margin:0;background:var(--ground);color:var(--ink);font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased}\nh1,h2,h3{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-weight:800;text-wrap:balance;margin:0;letter-spacing:-.02em;line-height:1.08}\n.mono,.eyebrow,th,.num,.tag,label,input,select,.rail a,.kicker,h4,.k,.v,.s,.seg button,.verdict,.stamp{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif}\n\n.shell{max-width:1180px;margin:0 auto;padding:0 22px 96px;display:grid;grid-template-columns:186px minmax(0,1fr);gap:52px;align-items:start}\n.rail{position:sticky;top:env(safe-area-inset-top,0px);padding:28px 0;display:flex;flex-direction:column;gap:2px;max-height:100vh;overflow-y:auto}\n.rail .kicker{font-size:9.5px;letter-spacing:normal;color:var(--faint);padding:0 0 10px}\n.rail a{font-size:11.5px;color:var(--muted);text-decoration:none;padding:5px 9px;border-radius:3px;border-left:2px solid transparent;line-height:1.35}\n.rail a:hover{color:var(--ink);background:var(--surface);border-left-color:var(--accent)}\n.rail a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\nmain{min-width:0;padding-top:28px}\n@media (max-width:900px){\n  .shell{grid-template-columns:1fr;gap:0;padding:0 16px 72px}\n  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding:14px 0 10px;border-bottom:1px solid var(--line);max-height:none}\n  .rail .kicker{display:none}
