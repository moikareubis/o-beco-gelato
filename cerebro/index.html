ine-offset:1px}\n.rv{display:flex;justify-content:space-between;font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:10.5px;color:var(--faint);margin-top:-3px}\n.rv b{color:var(--ink);font-size:14px;font-weight:600}\n.readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line)}\n@media (max-width:640px){.readout{grid-template-columns:1fr 1fr}}\n@media (max-width:420px){.readout{grid-template-columns:1fr}}\n.cell{background:var(--surface);padding:16px 18px}\n.cell .k{font-size:9.5px;letter-spacing:.1em;color:var(--faint)}\n.cell .v{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-weight:800;font-size:24px;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1}\n.cell .s{font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.45}\n.cell.wide{grid-column:1/-1}\n.cell .v.acc{color:var(--accent)} .cell .v.warm{color:var(--warm)} .cell .v.bad{color:var(--crit)}\n.verdict{font-size:11.5px;padding:7px 11px;border-radius:2px;display:block;line-height:1.5}\n.v-ok{background:var(--accent-soft);color:var(--good)}\n.v-no{background:var(--crit-soft);color:var(--crit)}\n\n.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:20px 0}\n@media (max-width:620px){.cards{grid-template-columns:1fr}}\n.cards>div{background:var(--surface);padding:16px 19px}\n.cards .n{font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:9.5px;color:var(--warm);letter-spacing:normal;}\n.cards h4{margin:7px 0 5px;text-transform:none;letter-spacing:-.01em;font-size:14.5px;color:var(--ink);font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-weight:600}\n.cards p{font-size:13.5px;line-height:1.5;margin:0;color:var(--muted)}\n\n.obj{border:1px solid var(--line);border-radius:4px;overflow:hidden;margin:20px 0;background:var(--surface)}\n.obj details{border-top:1px solid var(--line)}\n.obj details:first-child{border-top:none}\n.obj summary{padding:13px 18px;cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;gap:11px;align-items:baseline}\n.obj summary::-webkit-details-marker{display:none}\n.obj summary::before{content:\"—\";color:var(--warm);font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:12px}\n.obj details[open] summary::before{content:\"+\";color:var(--accent)}\n.obj summary:hover{background:var(--surface-2)}\n.obj summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}\n.obj .a{padding:0 18px 15px 41px;font-size:14.5px;color:var(--muted)}\n.obj .a p{max-width:64ch;margin-bottom:9px}\n.obj .a p:last-child{margin-bottom:0}\n\n.tag{display:inline-block;font-family:\"Instrument Sans\", system-ui, -apple-system, sans-serif;font-size:10px;letter-spacing:normal;padding:3px 7px;border-radius:2px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--line)}\n.tag.w{background:var(--warm-soft);color:var(--warm)}\nfooter{border-top:1px solid var(--line);padding:24px 0 0;font-size:13px;color:var(--faint);max-width:72ch}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}", html: "<div class=\"shell\">\n  <nav class=\"rail\">\n    <div class=\"kicker\">Playbook v3<\/div>\n    <a href=\"#resposta\">A resposta direta<\/a>\n    <a href=\"#mudou\">O que mudou da v2<\/a>\n    <a href=\"#tabela\">As três linhas<\/a>\n    <a href=\"#conta\">A conta do pote<\/a>\n    <a href=\"#diluicao\">Diluir o freezer<\/a>\n    <a href=\"#calc\">Calculadora<\/a>\n    <a href=\"#folga\">O que a folga compra<\/a>\n    <a href=\"#seu\">O freezer é seu<\/a>\n    <a href=\"#regras\">Regras e prazos<\/a>\n    <a href=\"#parque\">Piloto e capital<\/a>\n    <a href=\"#fundadores\">Turma Fundadora<\/a>\n    <a href=\"#rua\">Roteiro de rua<\/a>\n    <a href=\"#premissas\">Premissas<\/a>\n  <\/nav>\n\n  <main>\n\n  <div class=\"hero\">\n    <div class=\"eyebrow\">O Beco Gelato · Programa B2B · v3 · Setembro 2026<\/div>\n    <h1>Beco no seu<br><span>balcão<\/span><\/h1>\n    <p class=\"lede\">O freezer nunca sai do seu nome, volta pelo preço do pote e se paga em menos de três meses. A v2 dizia que o custo do pote era o problema do modelo. Com o custo real do Balanceador, ele não é — e o que era aperto virou folga.<\/p>\n    <p style=\"margin-top:18px\"><span class=\"stamp\">Freezer R$ 3.500 · volta em <b>2,7 meses<\/b> · continua sendo seu<\/span><\/p>\n  <\/div>\n\n  <!-- ================= RESPOSTA ================= -->\n  <section id=\"resposta\" style=\"border-top:none;padding-top:16px\">\n    <div class=\"eyebrow\">A resposta direta<\/div>\n    <h2>Você vende a R$ 18,70 e R$ 20,50. Você ganha R$ 8,40 por pote.<\/h2>\n    <p>Média das seis fórmulas, no freezer médio, a 120 potes por mês. O resto desta página é a explicação dessa frase e o que fazer com o espaço que ela abre.<\/p>\n\n    <div class=\"answer\">\n      <div class=\"hd\">Média das 6 fórmulas · freezer M R$ 3.500 · mínimo 120 potes/mês · custo real do Balanceador<\/div>\n      <div class=\"rows\">\n        <div><div class=\"v\">R$ 19,90<\/div><div class=\"k\">Você vende<br>ao parceiro, na média<\/div><\/div>\n        <div><div class=\"v warm\">R$ 31,40<\/div><div class=\"k\">Ele vende<br>ao consumidor, na média<\/div><\/div>\n        <div><div class=\"v acc\">R$ 8,40<\/div><div class=\"k\">Seu lucro<br>por pote<\/div><\/div>\n        <div><div class=\"v acc\">R$ 1.007<\/div><div class=\"k\">Seu lucro<br>por mês, nesse ponto<\/div><\/div>\n      <\/div>\n    <\/div>\n\n    <p style=\"margin-top:22px\">E a pergunta original: <strong>R$ 2.500 diluídos em 12 meses são R$ 208,33 por mês.<\/strong> Com margem bruta de R$ 10,83 por pote, são <strong>19 potes por mês<\/strong> — de um pedido mínimo de 120. O freezer está pago na terceira semana de cada mês.<\/p>\n  <\/section>\n\n  <!-- ================= MUDOU ================= -->\n  <section id=\"mudou\">\n    <div class=\"eyebrow\">Correção<\/div>\n    <h2>O que mudou da v2, e por quê<\/h2>\n    <p>A v2 foi escrita com <strong>custo de R$ 12,00 por pote<\/strong>, que era a média que você tinha na cabeça antes das fórmulas fecharem. O Balanceador agora calcula o custo real de cada uma das seis, e ele é <strong>R$ 7,68 na média<\/strong> — 36% menos. O sabor mais caro da linha, o Café Proteico, custa R$ 10,46: ainda abaixo do que a v2 usava como média.<\/p>\n\n    <div class=\"tw\">\n      <table style=\"min-width:540px\">\n        <thead><tr><th>O que a v2 dizia<\/th><th>O que vale agora<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>Custo do pote R$ 12,00<\/td><td class=\"hi\">R$ 4,53 a R$ 10,46 conforme o sabor · média R$ 7,68<\/td><\/tr>\n          <tr><td>Balcão de R$ 34,90 é o piso do modelo<\/td><td class=\"hi\">R$ 29,90 e R$ 32,90 fecham com folga<\/td><\/tr>\n          <tr><td>Padaria e mercado de bairro estão fora<\/td><td class=\"hi\">Entram — é o canal que o custo real abre<\/td><\/tr>\n          <tr><td>Lucro de R$ 4,60 por pote<\/td><td class=\"hi\">R$ 8,40 na média, R$ 6,19 no pior sabor<\/td><\/tr>\n          <tr><td>Freezer M volta em 4,1 meses<\/td><td class=\"hi\">2,7 meses<\/td><\/tr>\n          <tr><td>\"O custo do pote é o problema real deste modelo\"<\/td><td class=\"hi\">Não é mais. O problema agora é quantos pontos você consegue abrir.<\/td><\/tr>\n        <\/tbody>\n        <caption>Custo = matéria-prima do pote pronto (gelato + mescla) pelo Balanceador, mais R$ 1,67 de embalagem (pote, colher e lacre).<\/caption>\n      <\/table>\n    <\/div>\n\n    <div class=\"note w\">\n      <h4>A ressalva que não pode sumir<\/h4>\n      <p>Os R$ 7,68 são <strong>insumo e embalagem<\/strong>. Não incluem mão de obra, energia, aluguel do laboratório nem depreciação. Se os R$ 12,00 da v2 já embutiam esse rateio, parte da diferença é contábil e não é dinheiro novo no bolso. Enquanto o custo fixo mensal não estiver levantado, trate qualquer lucro abaixo de <strong>R$ 4,50 por pote<\/strong> como inviável — é essa faixa que absorve o rateio que ainda não entrou na conta.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ================= TABELA ================= -->\n  <section id=\"tabela\">\n    <div class=\"eyebrow\">Estrutura<\/div>\n    <h2>As três linhas, sabor por sabor<\/h2>\n    <p>O preço é por linha, não por volume: o que define quanto o parceiro paga é o que ele está comprando, não quanto ele gira. Isso é mais simples de vender e impossível de confundir no pedido.<\/p>\n\n    <div class=\"tw\">\n      <table>\n        <thead><tr><th>Sabor<\/th><th>Linha<\/th><th class=\"n\">Custo<\/th><th class=\"n\">Atacado<\/th><th class=\"n\">Balcão<\/th><th class=\"n\">Margem bruta<\/th><th class=\"n\">Seu lucro (M)<\/th><th class=\"n\">Lucro dele<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td class=\"lbl\">Sorbet Morango<\/td><td>Fresh<\/td><td class=\"n\">R$ 4,53<\/td><td class=\"n\">R$ 18,70<\/td><td class=\"n\">R$ 29,90<\/td><td class=\"n\">R$ 12,83<\/td><td class=\"n hi\">R$ 10,40<\/td><td class=\"n\">R$ 11,20<\/td><\/tr>\n          <tr><td class=\"lbl\">Manga com Maracujá<\/td><td>Fresh<\/td><td class=\"n\">R$ 5,37<\/td><td class=\"n\">R$ 18,70<\/td><td class=\"n\">R$ 29,90<\/td><td class=\"n\">R$ 11,99<\/td><td class=\"n hi\">R$ 9,56<\/td><td class=\"n\">R$ 11,20<\/td><\/tr>\n          <tr><td class=\"lbl\">Torta de Limão<\/td><td>Special<\/td><td class=\"n\">R$ 7,85<\/td><td class=\"n\">R$ 20,50<\/td><td class=\"n\">R$ 32,90<\/td><td class=\"n\">R$ 11,23<\/td><td class=\"n hi\">R$ 8,80<\/td><td class=\"n\">R$ 12,40<\/td><\/tr>\n          <tr><td class=\"lbl\">Brigadeiro Proteico<\/td><td>Boost<\/td><td class=\"n\">R$ 7,99<\/td><td class=\"n\">R$ 20,50<\/td><td class=\"n\">R$ 32,90<\/td><td class=\"n\">R$ 11,09<\/td><td class=\"n hi\">R$ 8,66<\/td><td class=\"n\">R$ 12,40<\/td><\/tr>\n          <tr><td class=\"lbl\">Pistache<\/td><td>Special<\/td><td class=\"n\">R$ 9,87<\/td><td class=\"n\">R$ 20,50<\/td><td class=\"n\">R$ 32,90<\/td><td class=\"n\">R$ 9,21<\/td><td class=\"n hi\">R$ 6,78<\/td><td class=\"n\">R$ 12,40<\/td><\/tr>\n          <tr><td class=\"lbl\">Café Proteico<\/td><td>Boost<\/td><td class=\"n\">R$ 10,46<\/td><td class=\"n\">R$ 20,50<\/td><td class=\"n\">R$ 32,90<\/td><td class=\"n\">R$ 8,62<\/td><td class=\"n hi\">R$ 6,19<\/td><td class=\"n\">R$ 12,40<\/td><\/tr>\n          <tr class=\"tot\"><td class=\"lbl\">Média<\/td><td>—<\/td><td class=\"n\">R$ 7,68<\/td><td class=\"n\">R$ 19,90<\/td><td class=\"n\">R$ 31,40<\/td><td class=\"n\">R$ 10,83<\/td><td class=\"n hi\">R$ 8,40<\/td><td class=\"n\">R$ 11,80<\/td><\/tr>\n        <\/tbody>\n        <caption>Margem bruta = atacado menos imposto (4,5%), custo e entrega (R$ 0,50). Seu lucro desconta ainda o freezer M diluído a R$ 2,43. Lucro dele = balcão menos atacado, antes dos custos dele.<\/caption>\n      <\/table>\n    <\/div>\n\n    <p><strong>A margem do lojista fica em 37,5% no Fresh e 37,7% no Special e no Boost.<\/strong> É margem de food service saudável — acima dos 30% que fazem ele ceder espaço de balcão, e abaixo dos 45% que sinalizariam que você está deixando dinheiro na mesa.<\/p>\n\n    <div class=\"note\">\n      <h4>Onde o portfólio aperta<\/h4>\n      <p>Pistache e Café Proteico são os únicos abaixo de R$ 7,00 de lucro — R$ 6,78 e R$ 6,19 — porque a pasta de pistache a R$ 450/kg e a base MEC Protein a R$ 148/kg são os dois insumos mais caros da casa. Ainda são bons números; só não são os melhores. Se um ponto pedir desconto, o desconto sai do Fresh, nunca desses dois.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ================= CONTA ================= -->\n  <section id=\"conta\">\n    <div class=\"eyebrow\">Unidade<\/div>\n    <h2>A conta do pote, linha por linha<\/h2>\n    <p>A barra está na escala real, para um pote da linha Special ou Boost vendido a R$ 20,50 num ponto com freezer M — o caso médio do programa:<\/p>\n\n    <div class=\"mech\">\n      <div class=\"bar\">\n        <div class=\"s-cmv\" style=\"width:44.6%\">Seu custo R$ 9,16<\/div>\n        <div class=\"s-tax\" style=\"width:4.5%\"><\/div>\n        <div class=\"s-log\" style=\"width:2.4%\"><\/div>\n        <div class=\"s-fz\" style=\"width:11.9%\">Freezer 2,43<\/div>\n        <div class=\"s-luc\" style=\"width:36.6%\">Lucro R$ 7,50<\/div>\n      <\/div>\n      <div class=\"legend\">\n        <span><i class=\"sw s-cmv\"><\/i>Custo médio Special/Boost · R$ 9,16<\/span>\n        <span><i class=\"sw s-tax\"><\/i>Imposto 4,5% · R$ 0,92<\/span>\n        <span><i class=\"sw s-log\"><\/i>Entrega · R$ 0,50<\/span>\n        <span><i class=\"sw s-fz\"><\/i>Freezer diluído · R$ 2,43<\/span>\n        <span><i class=\"sw s-luc\"><\/i>Seu lucro · R$ 7,50<\/span>\n      <\/div>\n    <\/div>\n\n    <p>Compare com a v2, onde o custo ocupava 57% da barra e o lucro 22%. Agora o custo ocupa 45% e o lucro 37%. <strong>A folga de doze pontos percentuais é o que este playbook tem de novo<\/strong> — e a seção \"O que a folga compra\" decide o que fazer com ela.<\/p>\n  <\/section>\n\n  <!-- ================= DILUIÇÃO ================= -->\n  <section id=\"diluicao\">\n    <div class=\"eyebrow\">A mecânica<\/div>\n    <h2>Como o freezer se dilui sem ele perceber<\/h2>\n    <p>Não existe cláusula, não existe saldo, não existe contador. O freezer entra como <strong>custo fixo do ponto<\/strong>, exatamente como a embalagem ou o frete — e some dentro do preço. A única coisa que existe é uma linha na sua planilha.<\/p>\n    <div class=\"mech\" style=\"text-align:center;font-size:15px;font-weight:500;color:var(--accent)\">\n      valor do freezer ÷ (12 meses × pedido mínimo) = quanto embutir por pote\n    <\/div>\n\n    <div class=\"tw\">\n      <table>\n        <thead><tr><th>Nível<\/th><th class=\"n\">Freezer<\/th><th class=\"n\">÷ 12 meses<\/th><th class=\"n\">Mínimo/mês<\/th><th class=\"n\">Embutido por pote<\/th><th class=\"n\">% do atacado<\/th><th class=\"n\">Volta em<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td class=\"lbl\">Beco P<\/td><td class=\"n\">R$ 2.200<\/td><td class=\"n\">R$ 183/mês<\/td><td class=\"n\">60 potes<\/td><td class=\"n hi\">R$ 3,06<\/td><td class=\"n\">15,4%<\/td><td class=\"n\">3,4 meses<\/td><\/tr>\n          <tr><td class=\"lbl\">Beco M<\/td><td class=\"n\">R$ 3.500<\/td><td class=\"n\">R$ 292/mês<\/td><td class=\"n\">120 potes<\/td><td class=\"n hi\">R$ 2,43<\/td><td class=\"n\">12,2%<\/td><td class=\"n\">2,7 meses<\/td><\/tr>\n          <tr><td class=\"lbl\">Beco V<\/td><td class=\"n\">R$ 5.000<\/td><td class=\"n\">R$ 417/mês<\/td><td class=\"n\">240 potes<\/td><td class=\"n hi\">R$ 1,74<\/td><td class=\"n\">8,7%<\/td><td class=\"n\">1,9 meses<\/td><\/tr>\n        <\/tbody>\n        <caption>\"Volta em\" é o payback real: valor do freezer ÷ margem bruta mensal do ponto no pedido mínimo, com a média das seis fórmulas. A diluição em 12 meses continua conservadora de propósito — a diferença entre 2,7 e 12 meses é o seu colchão para inadimplência e churn.<\/caption>\n      <\/table>\n    <\/div>\n\n    <p class=\"small\">Colocar isso em nota fiscal, contrato ou conversa seria um erro: no minuto em que o parceiro vê \"R$ 2,43 de freezer\", ele começa a negociar essa linha, e a pedir desconto quando \"o freezer estiver pago\". Não existe freezer pago para ele. Existe preço.<\/p>\n  <\/section>\n\n  <!-- ================= CALCULADORA ================= -->\n  <section id=\"calc\">\n    <div class=\"eyebrow\">Ferramenta<\/div>\n    <h2>Calculadora: vendo por quanto, ganho quanto<\/h2>\n    <p>Os seis sabores já vêm com o custo real do Balanceador e o preço da sua linha. Troque de sabor para ver o pior e o melhor caso, mexa no giro para simular um ponto específico, e olhe o alerta embaixo — ele avisa quando a margem do lojista ficou fina demais ou quando o seu lucro entrou na faixa que o rateio ainda não coberto pode comer.<\/p>\n\n    <div class=\"sim\">\n      <div class=\"sim-head\">\n        <span>Um ponto de venda<\/span>\n        <span id=\"tag\">Média · Beco M · 120 potes/mês · <b>lucro R$ 8,40/pote<\/b><\/span>\n      <\/div>\n      <div class=\"sim-body\">\n        <div class=\"controls\">\n          <div class=\"ctl\">\n            <label for=\"sab\">Sabor<\/label>\n            <select id=\"sab\">\n              <option value=\"med\" selected>Média das 6 fórmulas<\/option>\n              <option value=\"mor\">Sorbet Morango · Fresh<\/option>\n              <option value=\"man\">Manga com Maracujá · Fresh<\/option>\n              <option value=\"tor\">Torta de Limão · Special<\/option>\n              <option value=\"bri\">Brigadeiro Proteico · Boost<\/option>\n              <option value=\"pis\">Pistache · Special<\/option>\n              <option value=\"caf\">Café Proteico · Boost<\/option>\n              <option value=\"cust\">Outro — eu digito<\/option>\n            <\/select>\n          <\/div>\n          <div class=\"ctl\">\n            <label>Freezer instalado<\/label>\n            <div class=\"seg\" id=\"segLvl\">\n              <button type=\"button\" data-lvl=\"P\" aria-pressed=\"false\">P · 2.200<\/button>\n              <button type=\"button\" data-lvl=\"M\" aria-pressed=\"true\">M · 3.500<\/button>\n              <button type=\"button\" data-lvl=\"V\" aria-pressed=\"false\">V · 5.000<\/button>\n            <\/div>\n          <\/div>\n          <div class=\"ctl\">\n            <label for=\"cmv\">Quanto o pote te custa (R$)<\/label>\n            <input type=\"number\" id=\"cmv\" value=\"7.68\" min=\"1\" max=\"30\" step=\"0.10\">\n          <\/div>\n          <div class=\"ctl\">\n            <label for=\"pa\">Preço que você cobra do parceiro<\/label>\n            <input type=\"range\" id=\"pa\" min=\"12\" max=\"30\" step=\"0.10\" value=\"19.90\">\n            <div class=\"rv\"><span>12<\/span><b>R$ <span id=\"paV\">19,90<\/span><\/b><span>30<\/span><\/div>\n          <\/div>\n          <div class=\"ctl\">\n            <label for=\"psc\">Preço de balcão sugerido<\/label>\n            <input type=\"range\" id=\"psc\" min=\"20\" max=\"52\" step=\"1\" value=\"32\">\n            <div class=\"rv\"><span>20<\/span><b>R$ <span id=\"pscV\">31,40<\/span><\/b><span>52<\/span><\/div>\n          <\/div>\n          <div class=\"ctl\">\n            <label for=\"pot\">Giro do ponto<\/label>\n            <input type=\"range\" id=\"pot\" min=\"20\" max=\"600\" step=\"10\" value=\"120\">\n            <div class=\"rv\"><span>20<\/span><b><span id=\"potV\">120<\/span> potes/mês<\/b><span>600<\/span><\/div>\n          <\/div>\n        <\/div>\n\n        <div class=\"readout\">\n          <div class=\"cell\"><div class=\"k\">Seu lucro por pote<\/div><div class=\"v acc\" id=\"oLuc\">R$ 8,40<\/div><div class=\"s\" id=\"oLucS\">depois de custo, imposto, entrega e freezer<\/div><\/div>\n          <div class=\"cell\"><div class=\"k\">Seu lucro por mês<\/div><div class=\"v acc\" id=\"oMes\">R$ 1.007<\/div><div class=\"s\" id=\"oMesS\">neste ponto, neste giro<\/div><\/div>\n          <div class=\"cell\"><div class=\"k\">Freezer volta em<\/div><div class=\"v\" id=\"oPb\">2,7 meses<\/div><div class=\"s\" id=\"oPbS\">R$ 3.500 ÷ margem bruta mensal<\/div><\/div>\n          <div class=\"cell\"><div class=\"k\">Freezer diluído por pote<\/div><div class=\"v\" id=\"oFz\">R$ 2,43<\/div><div class=\"s\" id=\"oFzS\">12,2% do preço · invisível para ele<\/div><\/div>\n          <div class=\"cell\"><div class=\"k\">Lucro do parceiro por pote<\/div><div class=\"v warm\" id=\"oLoj\">R$ 11,50<\/div><div class=\"s\" id=\"oLojS\">margem de 36,6% no balcão<\/div><\/div>\n          <div class=\"cell\"><div class=\"k\">Doze meses neste ritmo<\/div><div class=\"v\" id=\"oAno\">R$ 12.090<\/div><div class=\"s\" id=\"oAnoS\">já líquido do freezer<\/div><\/div>\n          <div class=\"cell wide\"><span class=\"verdict v-ok\" id=\"oVer\">Modelo saudável nos dois lados.<\/span><\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ================= FOLGA ================= -->\n  <section id=\"folga\">\n    <div class=\"eyebrow\">Decisão<\/div>\n    <h2>O que a folga compra<\/h2>\n    <p>Com R$ 8,40 de lucro por pote em vez de R$ 4,60, você tem quase o dobro de espaço. Ele pode virar quatro coisas diferentes, e elas competem entre si — vale escolher uma antes de sair vendendo.<\/p>\n\n    <div class=\"cards\">\n      <div><div class=\"n\">Opção 1<\/div><h4>Mais pontos, mesmo preço<\/h4><p>Guarde a folga como margem e use o capital extra para instalar mais freezers. É o caminho mais direto para os 10.000 potes/mês, e o que mais consome caixa no começo.<\/p><\/div>\n      <div><div class=\"n\">Opção 2<\/div><h4>Canal popular com balcão menor<\/h4><p>Uma faixa de R$ 24,90 a R$ 27,90 para padaria e mercado de bairro, que a v2 descartava. No Fresh a R$ 24,90 de balcão você ainda ganha R$ 6,43 por pote. Abre volume onde a marca ainda não chega.<\/p><\/div>\n      <div><div class=\"n\">Opção 3<\/div><h4>Escada de volume por cima da linha<\/h4><p>Manter o preço por linha como está e dar R$ 1,00 de desconto acima de 240 potes/mês. Custa pouco e dá ao parceiro um motivo para crescer que não é a promessa do freezer.<\/p><\/div>\n      <div><div class=\"n\">Opção 4<\/div><h4>Absorver o rateio antes de gastar<\/h4><p>Levantar o custo fixo mensal primeiro e só então decidir. É a opção chata e provavelmente a certa: a folga pode ser menor do que parece, e nenhuma das outras três é reversível depois que o preço foi para a rua.<\/p><\/div>\n    <\/div>\n\n    <div class=\"note c\">\n      <h4>Não faça as quatro<\/h4>\n      <p>A folga é uma só. Se ela financiar desconto popular <em>e<\/em> escada de volume <em>e<\/em> expansão de parque ao mesmo tempo, ela some e você descobre isso no terceiro mês, com cinco freezers instalados e o preço já combinado. A opção 4 não impede as outras — ela só define de quanto elas podem ser.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ================= FREEZER É SEU ================= -->\n  <section id=\"seu\">\n    <div class=\"eyebrow\">Propriedade<\/div>\n    <h2>O freezer é seu, para sempre, e isso se diz em voz alta<\/h2>\n    <p>Não é um constrangimento a esconder — é uma vantagem para os dois lados, e explicada assim ninguém reclama:<\/p>\n    <div class=\"cards\">\n      <div><div class=\"n\">Para ele<\/div><h4>Ele nunca paga manutenção<\/h4><p>Compressor queimou, borracha ressecou, termostato descalibrou: é problema seu. Se o freezer fosse dele, seria uma conta de R$ 800 num sábado de dezembro.<\/p><\/div>\n      <div><div class=\"n\">Para ele<\/div><h4>Ele sobe de tamanho de graça<\/h4><p>Girou mais, ganha um freezer maior por sua conta. Quem compra o próprio freezer fica preso ao tamanho que comprou.<\/p><\/div>\n      <div><div class=\"n\">Para você<\/div><h4>O ativo continua no seu balanço<\/h4><p>Sai por nota de remessa em comodato (CFOP 5908, retorno 5909), fica no imobilizado e deprecia. Não é venda, não é receita, não é imposto.<\/p><\/div>\n      <div><div class=\"n\">Para você<\/div><h4>O freezer é reciclável<\/h4><p>Ponto fechou, o equipamento volta e vai para o próximo — e o segundo ciclo tem custo zero. É aí que o modelo fica realmente bom.<\/p><\/div>\n    <\/div>\n\n    <div class=\"note\">\n      <h4>A frase para a mesa<\/h4>\n      <p><em>\"O freezer é meu e continua sendo meu — inclusive a manutenção. Você não investe nada e não herda problema nenhum. O que eu peço em troca é que ele só tenha produto Beco dentro e um pedido mínimo por mês.\"<\/em> Isso resolve a conversa em quinze segundos, e nenhum lojista sério discorda.<\/p>\n    <\/div>\n  <\/section>\n\n  <!-- ================= REGRAS ================= -->\n  <section id=\"regras\">\n    <div class=\"eyebrow\">Contrato<\/div>\n    <h2>Regras e prazos — o mínimo necessário<\/h2>\n    <div class=\"tw\">\n      <table style=\"min-width:540px\">\n        <thead><tr><th>Cláusula<\/th><th>Como fica<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td class=\"lbl\">Comodato<\/td><td>Freezer da Beco, adesivado, número de série no contrato, endereço de instalação e foto da posição em anexo. Prazo indeterminado, sem transferência de propriedade em nenhuma hipótese.<\/td><\/tr>\n          <tr><td class=\"lbl\">Pedido mínimo<\/td><td>60 / 120 / 240 potes por mês conforme o nível, apurado por <strong>trimestre<\/strong> (3× o mensal), com piso de 60% em qualquer mês isolado.<\/td><\/tr>\n          <tr><td class=\"lbl\">1º pedido<\/td><td><strong>30 dias para pagar.<\/strong> Ele vende antes de desembolsar — é o que destrava o sim.<\/td><\/tr>\n          <tr><td class=\"lbl\">2º e 3º pedidos<\/td><td>21 dias.<\/td><\/tr>\n          <tr><td class=\"lbl\">4º em diante<\/td><td>14 dias, ou Pix na entrega com 4% de desconto.<\/td><\/tr>\n          <tr><td class=\"lbl\">Exclusividade<\/td><td>Só produto Beco Gelato dentro do freezer. Não se exige exclusividade do estabelecimento.<\/td><\/tr>\n          <tr><td class=\"lbl\">Energia e conservação<\/td><td>Por conta dele. Avaria por mau uso, por conta dele. Compressor e manutenção preventiva, por sua conta.<\/td><\/tr>\n          <tr><td class=\"lbl\">Troca de sabor parado<\/td><td>Uma por trimestre, até 5% do volume, produto íntegro e na validade.<\/td><\/tr>\n          <tr><td class=\"lbl\">Descumprimento<\/td><td>1 trimestre abaixo → plano de giro de 30 dias. 2 trimestres → rebaixa de nível ou retirada do freezer. Atraso de 30 dias → retirada.<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n    <p class=\"small\">A energia do 503 L é ~2,9 kWh/dia, cerca de 87 kWh e R$ 78 por mês. Tenha esse número na ponta da língua: ele aparece em toda negociação e quase ninguém sabe responder.<\/p>\n  <\/section>\n\n  <!-- ================= PARQUE ================= -->\n  <section id=\"parque\">\n    <div class=\"eyebrow\">Capital<\/div>\n    <h2>O piloto de cinco pontos<\/h2>\n    <div class=\"tw\">\n      <table>\n        <thead><tr><th>Mix<\/th><th class=\"n\">Capital<\/th><th class=\"n\">Potes/mês<\/th><th class=\"n\">Faturamento/mês<\/th><th class=\"n\">Margem bruta/mês<\/th><th class=\"n\">Payback do parque<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td class=\"lbl\">2 × P + 2 × M + 1 × V<\/td><td class=\"n\">R$ 16.400<\/td><td class=\"n\">600<\/td><td class=\"n\">R$ 11.940<\/td><td class=\"n\">R$ 6.496<\/td><td class=\"n hi\">2,5 meses<\/td><\/tr>\n        <\/tbody>\n        <caption>Todos os pontos no pedido mínimo da sua faixa, com o mix médio das seis fórmulas. Doze meses assim: 7.200 potes, R$ 143.280 faturados, R$ 77.948 de margem bruta — R$ 61.548 já líquidos de todo o capital dos freezers.<\/caption>\n      <\/table>\n    <\/div>\n\n    <div class=\"note\">\n      <h4>O caixa que o piloto compromete<\/h4>\n      <p>R$ 16.400 em equipamento, cerca de R$ 2.500 de kits de ativação e R$ 4.608 de custo do primeiro pedido dos cinco: <strong>R$ 23.508 fora do caixa antes do primeiro recebimento<\/strong>, que só entra no dia 30 por causa do prazo de trinta dias. É R$ 2.600 menos que na v2, porque o primeiro pedido ficou mais barato de produzir. Sessenta dias medindo giro real por sabor valem mais que qualquer projeção desta página.<\/p>\n    <\/div>\n\n    <p>E o dimensionamento honesto: 600 potes/mês são 6% da sua meta de 10.000. Para tirar 5.000 potes/mês só do B2B você precisa de 25 a 40 pontos. O piloto não é a operação — é o teste que diz se vale construí-la, e com payback de 2,5 meses o teste se paga sozinho antes de acabar.<\/p>\n  <\/section>\n\n  <!-- ================= FUNDADORES ================= -->\n  <section id=\"fundadores\">\n    <div class=\"eyebrow\">Escassez<\/div>\n    <h2>Turma Fundadora — os cinco primeiros<\/h2>\n    <p>O que eles valem não é faturamento: é prova social, giro real por sabor e um portfólio testado por quem vende. Nada aqui envolve o freezer — o freezer não está em jogo. Cinco vagas, numeradas, e fechadas para sempre depois do piloto.<\/p>\n    <div class=\"cards\">\n      <div><div class=\"n\">Preço<\/div><h4>Travado por 12 meses<\/h4><p>Sem reajuste, mesmo se a base ou a embalagem subirem. Você absorve — e eles sabem que você absorveu.<\/p><\/div>\n      <div><div class=\"n\">Equipamento<\/div><h4>Upgrade automático<\/h4><p>Bateu o giro do nível de cima por dois meses, o freezer maior vai por sua conta, sem pedir.<\/p><\/div>\n      <div><div class=\"n\">Lançamento<\/div><h4>Trinta dias antes<\/h4><p>Sabor novo chega a eles antes da rede, com 12 potes de cortesia para vender exclusividade enquanto ninguém mais tem.<\/p><\/div>\n      <div><div class=\"n\">Co-criação<\/div><h4>Banca de provas<\/h4><p>Sessão bimestral com você. Um sabor por semestre é escolhido pela turma e entra no portfólio de verdade.<\/p><\/div>\n      <div><div class=\"n\">Ponto<\/div><h4>Kit de ativação<\/h4><p>Adesivagem, display de balcão, cardápio com QR, 24 potes de degustação e arte pronta para o Instagram deles.<\/p><\/div>\n      <div><div class=\"n\">Marca<\/div><h4>Vitrine<\/h4><p>Nome e foto no \"onde encontrar\", nos Stories de lançamento e num Reels de bastidor gravado no ponto.<\/p><\/div>\n      <div><div class=\"n\">Status<\/div><h4>Selo numerado<\/h4><p>Placa \"Fundador nº X de 5\" no freezer. O número não se repete nunca, e isso é metade do valor da condição.<\/p><\/div>\n      <div><div class=\"n\">Rede<\/div><h4>Indicação<\/h4><p>R$ 300 em crédito de produto por ponto indicado que assinar e cumprir dois meses de mínimo.<\/p><\/div>\n      <div><div class=\"n\">Contrato<\/div><h4>Saída livre<\/h4><p>Sem multa em nenhum momento. Devolve o freezer e encerra. É o que torna o sim barato de dar.<\/p><\/div>\n      <div><div class=\"n\">Rede<\/div><h4>Prioridade de entrega<\/h4><p>Na falta de estoque de um sabor, eles são atendidos primeiro. Custa zero e vale muito no verão.<\/p><\/div>\n    <\/div>\n    <p class=\"small\"><strong>Contrapartida, escrita no termo:<\/strong> contagem mensal de giro por sabor até o dia 5, duas gravações de conteúdo no ponto por semestre, resposta à prova de sabor em 7 dias, e freezer na posição combinada. Programa de fundador sem contrapartida é desconto com nome bonito. Custo total dos cinco: cerca de R$ 2.500.<\/p>\n  <\/section>\n\n  <!-- ================= RUA ================= -->\n  <section id=\"rua\">\n    <div class=\"eyebrow\">Execução<\/div>\n    <h2>Roteiro de rua e as objeções que vêm<\/h2>\n    <p>Três tempos: <strong>degustação sem proposta<\/strong> (15 min, bolsa térmica, seis potes, quatro perguntas — fluxo de caixa por dia, ticket médio, quem decide, onde tem tomada); <strong>proposta de uma página em 48h<\/strong> com o nome dele no topo e o lucro mensal em corpo maior que tudo; <strong>instalação em 7 dias<\/strong> com freezer adesivado, sortimento montado e dez minutos de treinamento da equipe. Meta do ciclo: 40 abordagens → 20 degustações → 10 contratos em 60 dias.<\/p>\n\n    <div class=\"obj\">\n      <details><summary>\"R$ 32,90 num pote de sorvete? Ninguém paga.\"<\/summary><div class=\"a\"><p>Não é sorvete — é gelato proteico, zero açúcar e zero lactose, e o comparável é a barra de proteína de R$ 18 e o açaí de R$ 32, não o picolé. E ofereça a saída: o Fresh sai a R$ 29,90 e tem o mesmo apelo com preço menor. Se mesmo assim travar, teste antes de discutir — 24 potes no ponto por duas semanas ao preço cheio dizem mais que qualquer argumento.<\/p><\/div><\/details>\n      <details><summary>\"Depois de um ano o freezer é meu?\"<\/summary><div class=\"a\"><p>Não, e isso é bom para você: manutenção, compressor e troca por um maior são por minha conta enquanto o freezer for meu. Se ele quiser o próprio equipamento, ele compra e a gente conversa preço — mas aí perde a manutenção e o upgrade.<\/p><\/div><\/details>\n      <details><summary>\"Não tenho espaço.\"<\/summary><div class=\"a\"><p>O vertical ocupa 0,42 m² de chão, menos que a maioria das lixeiras do salão, e coloca o produto na altura dos olhos. Leve a fita métrica e mostre onde cabe.<\/p><\/div><\/details>\n      <details><summary>\"E se não vender?\"<\/summary><div class=\"a\"><p>Mínimo apurado por trimestre, troca de 5% do volume por sabor parado, e saída sem multa devolvendo o freezer. O risco dele é zero: o capital é seu.<\/p><\/div><\/details>\n      <details><summary>\"E a conta de luz?\"<\/summary><div class=\"a\"><p>Cerca de R$ 78 por mês no 503 L, contra R$ 1.380 de lucro dele a 120 potes. Traga o número — quase nenhum concorrente traz.<\/p><\/div><\/details>\n      <details><summary>\"Já trabalho com sorvete.\"<\/summary><div class=\"a\"><p>A exclusividade é só dentro do meu freezer. O que ele já tem continua onde está, e o ticket do pote Beco é três vezes o do picolé — não canibaliza, soma.<\/p><\/div><\/details>\n      <details><summary>\"Me dá um desconto.\"<\/summary><div class=\"a\"><p>O desconto sai do Fresh, nunca do Pistache nem do Café — esses dois já são os de menor lucro da casa, por causa da pasta de pistache e da base proteica. Melhor que desconto: ofereça subir o freezer de tamanho, que custa menos e vale mais para ele.<\/p><\/div><\/details>\n      <details><summary>\"Me manda no WhatsApp que eu vejo.\"<\/summary><div class=\"a\"><p>Não mande. \"Prefiro que você prove — passo terça de manhã ou quinta à tarde?\" Proposta enviada antes da degustação vira comparação de preço, e você perde toda comparação de preço.<\/p><\/div><\/details>\n    <\/div>\n  <\/section>\n\n  <!-- ================= PREMISSAS ================= -->\n  <section id=\"premissas\">\n    <div class=\"eyebrow\">Ficha técnica<\/div>\n    <h2>Premissas<\/h2>\n    <div class=\"tw\">\n      <table>\n        <thead><tr><th>Variável<\/th><th class=\"n\">Valor<\/th><th>Origem<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td class=\"lbl\">Custo por sabor<\/td><td class=\"n\">4,53 a 10,46<\/td><td><span class=\"tag\">verificado<\/span> Balanceador, backup de 27/09: matéria-prima do pote pronto mais R$ 1,67 de embalagem. <strong>Não inclui mão de obra, energia nem rateio.<\/strong><\/td><\/tr>\n          <tr><td class=\"lbl\">Atacado por linha<\/td><td class=\"n\">18,70 / 20,50<\/td><td><span class=\"tag\">seu número<\/span> Fresh R$ 18,70; Special e Boost R$ 20,50. Preços que você já aplica.<\/td><\/tr>\n          <tr><td class=\"lbl\">Balcão sugerido<\/td><td class=\"n\">29,90 / 32,90<\/td><td><span class=\"tag\">seu número<\/span> Fresh R$ 29,90; Special e Boost R$ 32,90.<\/td><\/tr>\n          <tr><td class=\"lbl\">Freezer P / M / V<\/td><td class=\"n\">2.200 / 3.500 / 5.000<\/td><td><span class=\"tag\">seu número<\/span> Médias de cotação informadas por você.<\/td><\/tr>\n          <tr><td class=\"lbl\">Pedido mínimo<\/td><td class=\"n\">60 / 120 / 240<\/td><td><span class=\"tag w\">proposto<\/span> Calibrado para diluir o freezer em 12 meses a R$ 3,06 / 2,43 / 1,74 por pote.<\/td><\/tr>\n          <tr><td class=\"lbl\">Imposto<\/td><td class=\"n\">4,5%<\/td><td><span class=\"tag w\">a validar<\/span> É o que está configurado no Balanceador. A v2 usava 7%. Confirmar anexo e faixa do Simples com o contador — a diferença vale R$ 0,50 por pote.<\/td><\/tr>\n          <tr><td class=\"lbl\">Entrega por pote<\/td><td class=\"n\">R$ 0,50<\/td><td><span class=\"tag w\">a validar<\/span> Rota própria, entrega quinzenal, ponto urbano.<\/td><\/tr>\n          <tr><td class=\"lbl\">Custo fixo mensal<\/td><td class=\"n\">não levantado<\/td><td><span class=\"tag w\">em aberto<\/span> A variável que falta. Enquanto não existir, o lucro por pote desta página é contribuição, não lucro final.<\/td><\/tr>\n          <tr><td class=\"lbl\">CFOP de comodato<\/td><td class=\"n\">5908 / 5909<\/td><td><span class=\"tag\">verificado<\/span> Remessa e retorno de bem por contrato de comodato, operação interna.<\/td><\/tr>\n          <tr><td class=\"lbl\">Consumo do 503 L<\/td><td class=\"n\">2,9 kWh/dia<\/td><td><span class=\"tag\">verificado<\/span> Ficha técnica Fricon HCEB503.<\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n\n    <footer>\n      <p>Playbook comercial B2B do O Beco Gelato · versão 3, setembro de 2026. A v2 foi escrita sobre um custo estimado de R$ 12,00 por pote; esta versão usa o custo real calculado pelo Balanceador. Restam dois números para fechar: o custo fixo mensal e a faixa do Simples. Nenhum dos dois muda o sinal da conta — os dois mudam o tamanho da folga.<\/p>\n    <\/footer>\n  <\/section>\n\n  <\/main>\n<\/div>", init: function(){
(function(){

  var SAB = {

    man:{c:5.37, pa:18.70, pb:29.90, nome:"Manga c/ Maracujá"},
    tor:{c:7.85, pa:20.50, pb:32.90, nome:"Torta de Limão"},
    bri:{c:7.99, pa:20.50, pb:32.90, nome:"Brigadeiro"},
    pis:{c:9.87, pa:20.50, pb:32.90, nome:"Pistache"},
    caf:{c:10.46,pa:20.50, pb:32.90, nome:"Café Proteico"}
  };
  var st = {lvl:"M", sab:"med", cmv:7.68, pa:19.90, pb:31.40, pot:120};
  var TAX = 0.045, LOG = 0.50;

  function brl(n,d){ d = d||0; return "R$ " + n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }
  function el(id){ return document.getElementById(id); }
  function vg(n,d){ return n.toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}); }

  el("sab").addEventListener("change", function(){
    st.sab = this.value;
    var s = SAB[st.sab];

    }
    ht.appendChild(c);
  });

  /* ---- dupla leitura ---- */
  var hd = document.getElementById("dup");
  DUP.forEach(function(d){
    var c = el("div","dup");
    var t = el("div","txt"); t.textContent = d.t; c.appendChild(t);
    var g = el("div","dois");
    [["c","o consumidor pensa",d.c],["e","o empresário pensa",d.e]].forEach(function(x){
      var b = el("div","le "+x[0]);
      var lb = el("span","lb"); lb.textContent = x[1]; b.appendChild(lb);
      b.appendChild(document.createTextNode(x[2]));
      g.appendChild(b);
    });
    c.appendChild(g);
    if (d.nota){ var nt = el("div","meta"); nt.style.cssText = "font-size:12.5px;color:#6B7065;margin-top:10px";
      nt.textContent = d.nota; c.appendChild(nt); }
    hd.appendChild(c);
  });

  /* ---- nunca ---- */
  var hn = document.getElementById("nunca");
  NUNCA.forEach(function(r){
    var li = el("li");
    var x = el("span","x"); x.textContent = "×";
    var box = el("div");
    var q = el("div","q"); q.innerHTML = r.q;
    var pq = el("div","pq"); pq.innerHTML = r.pq;
    box.appendChild(q); box.appendChild(pq);
    li.appendChild(x); li.appendChild(box);
    hn.appendChild(li);
  });
})();
}}
};
  var navEl=document.getElementById("nav"), host=document.getElementById("host");
  var cssEl=document.getElementById("toolcss"), cur=null, botoes={};

  var marca=document.createElement("div"); marca.className="marca";
  var b=document.createElement("b"); b.textContent="Beco Gelato";
  var s=document.createElement("span"); s.textContent="o cérebro";
  marca.appendChild(b); marca.appendChild(s); navEl.appendChild(marca);

  NAV.forEach(function(it){
    var btn=document.createElement("button"); btn.type="button";
    var t=document.createElement("span"); t.className="t"; t.textContent=it.n;
    var d=document.createElement("span"); d.className="s"; d.textContent=it.d;
    btn.appendChild(t); btn.appendChild(d);
    btn.addEventListener("click",function(){abrir(it.id);});
    navEl.appendChild(btn); botoes[it.id]=btn;
  });
  var fim=document.createElement("div"); fim.className="fim";
  fim.textContent="Tudo numa página só. O que você mexe aqui fica salvo e aparece nas outras abas.";
  navEl.appendChild(fim);

  function abrir(id){
    if(!T[id] || cur===id) return;
    cur=id;
    for(var k in botoes) botoes[k].classList.toggle("on", k===id);
    cssEl.textContent=T[id].css;
    host.innerHTML=T[id].html;
    window.scrollTo(0,0);
    if(T[id].init){ try{ T[id].init(); }catch(e){ console.error("["+id+"]",e); } }
    try{ if(location.hash.slice(1)!==id) history.replaceState(null,"","#"+id); }catch(e){}
  }

  var inicial=location.hash.slice(1);
  abrir(T[inicial]?inicial:"painel");
  window.addEventListener("hashchange",function(){var h=location.hash.slice(1); if(T[h]) abrir(h);});
})();
</script>
